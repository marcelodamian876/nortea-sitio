<script>if (top !== self) throw 0;

"use strict";
// ============================================================
// Vigía del arranque. Va en su propio bloque de script, antes que la app: aunque la app no llegue a correr, este sí responde.
// Si una etapa automática (abrir la app, abrir la bóveda con el PIN, cargar los datos) tarda de más —algo se colgó en el teléfono, por
// ejemplo IndexedDB o WebCrypto en Safari— enseña «Reintentar» y «Borrar caché de la app» (sin borrar la llave cifrada, el PIN ni los
// cambios por mandar) y avisa del error a la hoja. Mientras la app espera a la persona (PIN, contraseña) el vigía no cuenta.
// ============================================================
const Vigia = (() => {
  let t = 0, etapa = "abrir la app", escala = 1;
  
  function guardar(msg) { try { const l = JSON.parse(localStorage.getItem("fin_err_pend") || "[]"); l.unshift({ t: Date.now(), msg: String(msg).slice(0, 300), donde: etapa }); localStorage.setItem("fin_err_pend", JSON.stringify(l.slice(0, 10))); } catch (e) {} }
  function mandar(msg) {   // directo a la hoja: con el token de ella, o con el id de este aparato (el servidor solo lo acepta de un aparato ya aprobado)
    try {
      const url = localStorage.getItem("fin_api"), tok = localStorage.getItem("fin_token"), ap = localStorage.getItem("fin_aparato");
      if (!url || !/^https:\/\/script\.google\.com\//.test(url)) return;
      const errores = [{ msg: String(msg).slice(0, 300), donde: "vigía · " + etapa, ua: String(navigator.userAgent || "").slice(0, 150), version: "vigia" }];
      const cuerpo = tok ? { accion: "error", token: tok, errores } : ap ? { accion: "error_aparato", aparato: ap, errores } : null;
      if (cuerpo) fetch(url, { method: "POST", body: JSON.stringify(cuerpo), headers: { "Content-Type": "text/plain;charset=utf-8" } }).catch(() => {});
    } catch (e) {}
  }
  function reportar(msg) { guardar(msg); mandar(msg); }
  async function borrarCache() {
    try { if (navigator.serviceWorker) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map((x) => x.unregister())); } } catch (e) {}
    try { if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map((k) => caches.delete(k))); } } catch (e) {}
    try { ["fin_cache_dc", "fin_cache_d", "fin_cache_p"].forEach((k) => localStorage.removeItem(k)); } catch (e) {}   // la llave cifrada, la bóveda, el PIN y la cola se quedan
    location.reload();
  }
  function mostrar(msg) {
    clearTimeout(t); t = 0;
    const texto = msg || "La app se tardó demasiado en «" + etapa + "».";
    reportar(texto);
    let r = document.getElementById("rescate");
    if (!r) { r = document.createElement("div"); r.id = "rescate"; r.setAttribute("role", "alertdialog"); document.body.appendChild(r); }
    r.innerHTML = '<div class="acc"><div class="icono">$</div><h1>Algo se trabó</h1><p class="sub"></p><button class="btn" type="button" data-r="otra">Reintentar</button><button class="btn2" type="button" data-r="cache">Borrar caché de la app</button><p class="nota">Tu llave, tu PIN y lo que no se ha mandado no se borran. Ya se avisó del error.</p></div>';
    r.querySelector(".sub").textContent = texto;
    r.onclick = (e) => { const b = e.target.closest("[data-r]"); if (!b) return; b.disabled = true; if (b.dataset.r === "otra") location.reload(); else borrarCache(); };
  }
  function poner(e, seg) { clearTimeout(t); etapa = e; t = setTimeout(() => mostrar(), (seg * 1000) / escala); }
  function listo() { clearTimeout(t); t = 0; }
  poner("abrir la app", 15);
  return { poner, listo, mostrar, reportar, get etapa() { return etapa; } };
})();
</script>

"use strict";

// Finanzas · app de finanzas personales (un solo archivo, sin datos dentro). Los datos viven en la hoja de Google del
// propietario; tools/finanzas-app/build.py cambia el bloque DATOS (abajo) por tools/finanzas-app/datos.js.
// Contrato de datos y de seguridad: tools/finanzas-app/README.md.

  function estadoCuenta(c, movs, vals) {

  const mesDeNombre = (t) => { const i = MESES.indexOf(t); if (i >= 0) return i + 1; const j = MESES_CORTO.indexOf(t.slice(0, 3)); return j >= 0 && (t.length === 3 || t === "sept") ? j + 1 : 0; };
  function interpretar(frase, ctx) {
    ctx = ctx || {};

    const tk = String(frase || "").trim().split(/\s+/).filter(Boolean).map((o) => ({ o, n: norm(o).replace(/^[^a-z0-9$]+|[^a-z0-9]+$/g, ""), uso: false }));

    const marca = (...ix) => ix.forEach((i) => { if (tk[i]) tk[i].uso = true; });
    const antes = (i, w) => tk[i - 1] && !tk[i - 1].uso && tk[i - 1].n === w;

// ---------- Movimientos ----------
function textoMov(m) {
  const c = cuentaPor(m.cuenta), cd = cuentaPor(m.cuenta_destino), nom = (x) => (x ? esc(x.nombre) : "sin cuenta");
  if (m.tipo === "gasto") { const k = catPor(m.categoria); return { e: k.emoji, t: m.concepto || k.nombre, s: `${fechaCorta(m.fecha)} · ${esc(k.nombre)} · ${nom(c)}`, m: "−" + pesos(m.monto), cls: "bad" }; }
  if (m.tipo === "ingreso") { const n = negPor(m.negocio); return { e: n.emoji, t: m.concepto || n.nombre, s: `${fechaCorta(m.fecha)} · ${esc(n.nombre)}${c ? " · " + esc(c.nombre) : ""}`, m: "+" + pesos(m.monto), cls: "ok" }; }
  if (m.tipo === "traspaso") return { e: "↔️", t: m.concepto || "Traspaso", s: `${fechaCorta(m.fecha)} · ${nom(c)} → ${nom(cd)}`, m: pesos(m.monto), cls: "mut" };
  return { e: "❔", t: "Sin anotar", s: `${fechaCorta(m.fecha)} · ajuste de ${nom(c)}`, m: (m.monto > 0 ? "+" : "") + pesos(m.monto), cls: colorSigno(m.monto) };
}
function listaMovs() {
  const q = N.norm(A.busca).trim();
  let l = movs().filter((m) => N.mesDe(m.fecha) === A.mes);
  if (q) l = movs().filter((m) => { const t = textoMov(m); return N.norm([t.t, t.s, m.nota, m.monto, m.concepto].join(" ")).includes(q); });   // al buscar se mira todo el historial
  l.sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)) || String(b.creado || "").localeCompare(String(a.creado || "")));
  if (!l.length) return `<p class="sub" style="padding:14px 0">${q ? "Nada coincide con esa búsqueda." : "Sin movimientos este mes."}</p>`;
  return l.slice(0, 300).map((m) => { const t = textoMov(m); return `<button type="button" class="rowb" data-a="editarMov" data-id="${esc(m.id)}"><span class="izq"><span class="e">${esc(t.e)}</span><span>${esc(t.t)}<small>${t.s}</small></span></span><b class="fin num ${t.cls}">${t.m}</b></button>`; }).join("") + (l.length > 300 ? `<p class="nota">Se muestran los 300 más recientes.</p>` : "");
}

// ---------- Tarjetas: fechas de corte y de pago (sin montos) ----------
const diasTxt = (n) => (n === 0 ? "hoy" : n === 1 ? "falta 1 día" : n > 1 ? "faltan " + n + " días" : "hace " + -n + (n === -1 ? " día" : " días"));
// avisos de arriba del Inicio: «💳 American Express: pagar antes del 26 nov (faltan 3 días)»; «Hoy corta Banregio Gold»
function avisosTarjetas() {
  const l = N.ordenTarjetas(cuentas().filter((c) => c.tipo === "tarjeta"), hoy()).filter((x) => !x.f.sinFechas);
  const rojos = l.filter((x) => x.f.aviso).map(({ c, f }) => {
    const n = esc(c.emoji || "💳") + " " + esc(c.nombre);
    const t = f.estado === "vencida" ? `${n}: venció hace ${-f.faltan} ${f.faltan === -1 ? "día" : "días"} (${esc(fechaCorta(f.limite))})` : f.estado === "hoy" ? `${n}: hoy es el límite de pago` : `${n}: pagar antes del ${esc(fechaCorta(f.limite))} (${diasTxt(f.faltan)})`;
    return `<div class="tj-aviso ${f.estado === "pendiente" ? "" : "fuerte"}" data-aviso-tarjeta="${esc(c.id)}" role="alert"><span>${t}</span><button type="button" class="mini-b" data-a="tjPagada" data-id="${esc(c.id)}">Ya la pagué</button></div>`;

// ---------- gasto rápido ----------
let G = null;
// Gasto rápido: botones solo Tarjeta y Efectivo (en ese orden) y Tarjeta por omisión. Si la frase dice «banco», el intérprete lo entiende igual.
const cuentasGasto = () => [TARJETA].concat(cuentas().filter((c) => c.tipo === "efectivo"));
const cuentaGasto = () => "tarjeta";
const ctxFrase = () => ({ hoy: hoy(), categorias: cats(), cuentas: [TARJETA].concat(cuentasPago().filter((c) => c.tipo !== "tarjeta")), ultimaCuenta: "tarjeta" });
function entendiGasto() {
  if (!G.frase.trim()) return `<div class="entiendo aviso2" data-ent>Ejemplos: «150 tacos» · «uber 85» · «ayer 300 gasolina efectivo» · «tacos 150 con tarjeta»</div>`;
  if (G.monto == null) return `<div class="entiendo mal" data-ent>Falta el monto. Escríbelo con número, por ejemplo «150 ${esc(G.frase.trim().split(/\s+/)[0] || "tacos")}».</div>`;

}
function pintarGasto() {
  $("#g-ent").innerHTML = entendiGasto();
  $("#g-cats").innerHTML = catsVisibles().map((c) => `<button type="button" class="cat ${G.cat === c.id ? "sel" : ""}" data-a="gCat" data-id="${esc(c.id)}"><em>${esc(c.emoji)}</em>${esc(c.nombre)}</button>`).join("") + `<button type="button" class="cat" data-a="gNuevaCat"><em>＋</em>Nueva</button>`;
  const chips = cuentasGasto(); if (G.cuenta && !chips.some((c) => c.id === G.cuenta) && cuentaPor(G.cuenta)) chips.push(cuentaPor(G.cuenta));   // «banco» dicho en la frase: se ve su botón
  $("#g-cuentas").innerHTML = chips.map((c) => `<button type="button" class="chip ${G.cuenta === c.id ? "sel" : ""}" data-a="gCuenta" data-id="${esc(c.id)}">${esc(c.emoji || (TIPOS[c.tipo] || {}).e)} ${esc(c.nombre)}</button>`).join("");
  const b = $("#g-guardar"), ok = G.monto > 0 && G.cat && G.cuenta;
  b.disabled = !ok; b.textContent = G.monto > 0 ? (G.cat ? "Guardar " + pesos(G.monto) : "Elige una categoría") : "Guardar";
  const f = $("#g-fecha"); if (f && f.value !== G.fecha) f.value = G.fecha;
}
function abrirGasto(prev) {
  G = prev || { frase: "", monto: null, cat: null, catManual: false, cuenta: cuentaGasto(), cuentaManual: false, fecha: hoy(), fechaManual: false, concepto: "" };
  hoja(`<h1>Nuevo gasto</h1><p class="sub" style="margin-bottom:12px">Escríbelo como lo dirías</p>
    <input class="campo gr" id="g-frase" data-i="gFrase" type="text" placeholder="150 tacos" value="${esc(G.frase)}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Escríbelo como lo dirías">

    <button type="button" class="btn" id="g-guardar" data-a="gGuardar">Guardar</button>`);

}
function gasInterpretar() {
  const r = N.interpretar(G.frase, ctxFrase());
  G.monto = r.monto; G.concepto = r.concepto;
  if (!G.catManual) G.cat = r.categoria;
  if (!G.cuentaManual) G.cuenta = r.cuenta;

}
async function gGuardar() {
  if (!G || !(G.monto > 0) || !G.cat || !G.cuenta) return;

// ---------- ajustar saldo ----------
let AJ = null;
function abrirAjuste(id) {
  const c = cuentaPor(id); if (!c) return;
  const e = estado().porId[id], tj = c.tipo === "tarjeta", app = tj ? -e.valor : e.valor;
  AJ = { id, app, tj, hay: e.hay };
  hoja(`<h1>Ajustar ${esc(c.emoji || (TIPOS[c.tipo] || {}).e)} ${esc(c.nombre)}</h1><p class="sub" style="margin-bottom:12px">Pon ${tj ? "lo que de verdad debes" : "lo que de verdad tienes"} hoy</p>
    <div class="row"><span class="mut">La app dice</span><b class="num">${pesos(app)}</b></div>
    <input class="campo gr num" style="margin-top:8px" id="aj-monto" data-i="ajMonto" inputmode="decimal" placeholder="$0" value="${esc(app)}" autocomplete="off" aria-label="Lo que de verdad tienes">
    <div id="aj-dif"></div><button type="button" class="btn" data-a="ajGuardar">Guardar ajuste</button>`);
  pintarAjuste();
}
function pintarAjuste() {
  const real = num($("#aj-monto").value), d = $("#aj-dif");
  if (real == null) { d.innerHTML = ""; return; }
  const dif = N.r2((AJ.tj ? -1 : 1) * (real - AJ.app));   // en «valor» (la tarjeta: más deuda = menos valor)
  if (!AJ.hay) { d.innerHTML = aviso("Esta cuenta todavía no tiene movimientos: se guarda como su <b>saldo inicial</b> de hoy (no sale como «Sin anotar»)."); return; }
  d.innerHTML = dif === 0 ? aviso("Sin diferencia.") : `<div class="entiendo" style="background:var(--rojo-bg)" data-dif>Diferencia: <b class="${colorSigno(dif)}">${dif > 0 ? "+" : ""}${pesos(dif)}</b>. Se guarda como <b>«Sin anotar»</b> y no se mete en tus jarras.</div>`;
}
async function ajGuardar() {
  const real = num($("#aj-monto").value); if (real == null) return;
  const c = cuentaPor(AJ.id), dif = N.r2((AJ.tj ? -1 : 1) * (real - AJ.app)), a = AJ; AJ = null; cerrarHoja();
  if (!a.hay) { await Datos.actualizar("cuentas", a.id, { saldo_inicial: N.r2(real), fecha_inicial: hoy() }); return toast("Saldo de " + c.nombre + ": " + pesos(real)); }
  if (dif === 0) return;
  await Datos.crear("movimientos", Datos.nuevoId(), { tipo: "ajuste", monto: dif, fecha: hoy(), cuenta: a.id, concepto: "Ajuste de saldo", nota: "", origen: "app", creado: iso(), actualizado: iso() });
  toast("Ajustado · sin anotar " + (dif > 0 ? "+" : "") + pesos(dif));
}

// ---------- acciones (todos los botones pasan por aquí: la página no usa atributos «on…» en línea) ----------

  },

  salirTel() { confirmar("¿Cerrar sesión en este teléfono?", rolApp === "pareja" ? "Se borra lo guardado aquí. Tus datos siguen cifrados en la nube: al volver a entrar con tu contraseña los recuperas." : "Se borra lo guardado en este teléfono (PIN y acceso). Tus datos siguen en la hoja; necesitarás tu llave para volver a entrar.", "salirSi", "Sí, cerrar sesión"); },

  },
  async alertasVistas() { const r = await Datos.alertasVistas(); if (r !== "ok") toast("No se pudo: " + r); render(true); },
  async respaldarAhora(el) { el.disabled = true; el.textContent = "Respaldando…"; const r = await Datos.respaldarAhora(); toast(r === "ok" ? "Respaldo hecho" : "No se pudo respaldar: " + r); render(true); },
  async aparatos() {
    hoja(`<h1>Mis aparatos</h1><p class="sub" style="margin:6px 0">Los teléfonos y navegadores que han usado tu llave. Uno nuevo no entra hasta que lo apruebas aquí; si quitas uno, ya no entra aunque tenga la llave. Si perdiste un teléfono, corre también cambiarLlave en Apps Script.</p><div id="ap-lista" class="card" style="padding:4px 14px"><p class="sub" style="padding:12px 0">Cargando…</p></div><button type="button" class="btn2" data-a="cerrar">Listo</button>`);

const INP = {
  busca(el) { if (A.busca === el.value) return; A.busca = el.value; const l = $("#movs-lista"); if (l) l.innerHTML = listaMovs(); },

  fMonto() {}, fFecha() {}, fConcepto() {}, cuNombre() {}, cuEmoji() {}, cuSaldo() {}, cuFecha() {}, ajMonto() { pintarAjuste(); }, pgMonto() {}, pgFecha() {},

document.addEventListener("click", (e) => { const el = e.target.closest("[data-a]"); if (!el || el.disabled) return; const f = ACC[el.dataset.a]; if (!f) return; if (el.tagName === "BUTTON") e.preventDefault(); Promise.resolve(f(el, e)).catch((x) => bandaError(x && x.message ? x.message : x)); });
// «change» solo para fechas y archivos: en los campos de texto ya se atendió cada «input», y repintar al soltar el foco se comía el toque siguiente
const alEscribir = (e) => { const el = e.target.closest("[data-i]"); if (!el || !INP[el.dataset.i]) return; if (e.type === "change" && !/^(date|file)$/.test(el.type)) return; INP[el.dataset.i](el, e); };
document.addEventListener("input", alEscribir); document.addEventListener("change", alEscribir);

// ---------- pintar ----------
let pendiente = 0;
function render(ya) {
  if (Candado.bloqueado) return;
  if (ya) { cancelAnimationFrame(pendiente); pendiente = 0; }
  else { if (pendiente) return; pendiente = requestAnimationFrame(() => { pendiente = 0; render(true); }); return; }
  const y = window.scrollY, v = VISTAS[A.vista] || vInicio;
  $("#app").innerHTML = v();
  if (A.vista === "cuenta") pintarFace();
  window.scrollTo(0, y);
  const n = cfg().nombre; if (n) ls.set("fin_nombre", n);
}
async function pintarFace() {
  const f = $("#face-fila"); if (!f) return;
  if (!(await Candado.faceDisponible())) { f.innerHTML = ""; return; }
  f.innerHTML = Candado.tieneFace() ? `<button type="button" class="btn2" data-a="faceOff">Desactivar Face ID</button>` : `<button type="button" class="btn2" data-a="faceOn">Activar Face ID</button>`;
}


// ---------- primer arranque: categorías, jarras, negocios y cuentas de arranque ----------
let sembrando = false;
// Lo que se agregó a las de arranque después de la primera versión (p. ej. «Otros» 📦): se crea si falta, sin duplicar
let completando = false;
function completarArranque() {
  if (completando || !Datos.sincronizado || Datos.ilegibles || !D.config.general) return;
  const faltan = N.BASE_CATS.filter((b) => !D.categorias[b.id] && !cats().some((c) => N.norm(c.nombre).trim() === N.norm(b.nombre).trim()));
  if (!faltan.length) return;
  completando = true;
  Datos.lote(faltan.map((c) => ({ op: "set", col: "categorias", id: c.id, data: { ...c, palabras: [], oculta: false } }))).finally(() => { completando = false; });
}
function sembrar() {
  if (sembrando || !(Datos.sincronizado || Datos.modo === "demo") || Datos.ilegibles) return;   // con registros que no se abren (otra llave) no se siembra: se pisarían
  if (D.config.general || Object.keys(D.categorias).length || Object.keys(D.cuentas).length) return;   // ya hay algo: no se toca
  sembrando = true;
  const f = hoy(), ops = [{ op: "set", col: "config", id: "general", data: { negocios: N.BASE_NEGOCIOS, jarras: N.BASE_JARRAS } }];
  N.BASE_CATS.forEach((c) => ops.push({ op: "set", col: "categorias", id: c.id, data: { ...c, palabras: [], oculta: false } }));
  [["cta_banco", "banco", "Banco", 1], ["cta_efectivo", "efectivo", "Efectivo", 2]].forEach(([id, tipo, nombre, o]) => ops.push({ op: "set", col: "cuentas", id, data: { nombre, tipo, emoji: EMOJI_TIPO[tipo], saldo_inicial: 0, fecha_inicial: f, orden: o, archivada: false } }));
  Datos.lote(ops).finally(() => { sembrando = false; });
}

// ---------- arranque ----------
Candado.alDesbloquear(() => render(true));
Datos.alError((msg) => bandaError(msg));
Datos.alEstado(() => { if (!Candado.bloqueado && (A.vista === "inicio" || A.vista === "cuenta")) render(); });
Datos.alPareja(() => { if (A.vista === "cuenta") render(); });
Datos.alSincronizar(() => { quitarBandaVieja(); sembrar(); completarArranque(); render(); });
["cuentas", "movimientos", "valuaciones", "categorias", "config", "metas"].forEach((c) => Datos.suscribir(c, (m) => { D[c] = m; render(); }));
(async function arrancar() {
  try {
    if (!Datos.hayAcceso()) await Datos.pantallaAcceso();
    rolApp = Datos.rol;
    await Candado.desbloquear();
    Vigia.poner("cargar tus datos", 30);
    await Datos.abrir();
    rolApp = Datos.rol;
    render(true);
    Vigia.listo();
    if (Datos.modo === "demo" || Datos.sincronizado) sembrar();   // sin señal y sin nada guardado no se siembra (para no duplicar)
  } catch (e) { Vigia.mostrar("No se pudo abrir: " + (e && e.message ? e.message : e)); }
})();

<script>if (top !== self) throw 0;

if ("serviceWorker" in navigator) {
  // «Hay versión nueva»: solo si ya había una versión controlando la página (en la primera instalación no sale)
  let habia = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!habia) { habia = true; return; }
    if (document.getElementById("version-nueva")) return;
    const f = document.createElement("div"); f.id = "version-nueva"; f.setAttribute("role", "status");
    f.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:2147483000;display:flex;gap:12px;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:#0f2a1c;color:#eef3ef;font:600 14px/1.2 system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.3)";
    const t = document.createElement("span"); t.textContent = "Hay versión nueva";
    const b = document.createElement("button"); b.type = "button"; b.textContent = "Actualizar";
    b.style.cssText = "min-height:34px;padding:0 14px;border:0;border-radius:10px;background:#2fd47a;color:#04140b;font:700 14px system-ui,sans-serif";
    b.addEventListener("click", () => location.reload());
    f.append(t, b); document.body.appendChild(f);
  });
  addEventListener("load", () => navigator.serviceWorker.register("/finanzas/sw.js", { scope: "/finanzas/" }).catch(() => {}));
}
