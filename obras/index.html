<style>
/* Concepto: libreta de obra con pantallas por niveles, como en iOS. Inicio, Obra y Detalle se apilan: la nueva entra por la derecha, la anterior se corre un poco, y se regresa con el botón, con el gesto desde el borde o con «atrás» del sistema. Marino, dorado y crema; el dorado solo en lo principal. */
:root {
  --bg: #f3f0e8; --fg: #0b1d2f; --muted: #55606b; --panel: #faf8f3; --line: #ddd7c9; --chip: #ebe6da;
  --accent: #b8893a; --accent-ink: #0b1d2f; --accent-text: #86601b; --oro-claro: #e8c777;
  --ok: #1a7a45; --ok-bg: #dcefe3; --bad: #b3261e; --bad-bg: #f6e1de;
  --warn: #8a5a00; --warn-bg: #f7ead0; --info: #1f5fa8; --info-bg: #dce8f6;
  --scrim: rgba(11, 29, 47, .45); --toast-btn: #e8c777; --nav-bg: rgba(243, 240, 232, .86);
  --f-display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(0.23, 1, 0.32, 1); --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
  --logo: none; --sab: max(6px, calc(env(safe-area-inset-bottom, 0px) - 20px));
  /* barra de abajo (v6): botones de 60 px, 10 px de aire arriba y, abajo, separada de la orilla y del indicador de inicio del iPhone */
  --sab-bar: max(14px, calc(env(safe-area-inset-bottom, 0px) - 4px)); --bar-h: calc(70px + var(--sab-bar) - var(--sab));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08131d; --fg: #ece8dc; --muted: #9aa5ae; --panel: #0f2133; --line: #1f3347; --chip: #172a3d;
    --accent: #c99a45; --accent-ink: #0b1d2f; --accent-text: #dcb066; --oro-claro: #e8c777;
    --ok: #4cd08a; --ok-bg: #123524; --bad: #ff8a80; --bad-bg: #3a1d22;
    --warn: #f0b95a; --warn-bg: #3a2d12; --info: #8fb6ee; --info-bg: #14283f;
    --scrim: rgba(0, 0, 0, .6); --toast-btn: #8a6420; --nav-bg: rgba(8, 19, 29, .86); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08131d; --fg: #ece8dc; --muted: #9aa5ae; --panel: #0f2133; --line: #1f3347; --chip: #172a3d;
  --accent: #c99a45; --accent-ink: #0b1d2f; --accent-text: #dcb066; --oro-claro: #e8c777;
  --ok: #4cd08a; --ok-bg: #123524; --bad: #ff8a80; --bad-bg: #3a1d22;
  --warn: #f0b95a; --warn-bg: #3a2d12; --info: #8fb6ee; --info-bg: #14283f;
  --scrim: rgba(0, 0, 0, .6); --toast-btn: #8a6420; --nav-bg: rgba(8, 19, 29, .86); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; touch-action: manipulation; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overflow: hidden; overscroll-behavior: none; max-width: 100%; height: 100%; }
/* iOS 26 (app en la pantalla de inicio): la vista quedaba más corta que la pantalla y la barra de abajo no llegaba a la orilla */
@media (display-mode: standalone) { html { min-height: min(100lvh, calc(100% + env(safe-area-inset-top, 0px))); } }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); height: 100%; overflow: hidden; overscroll-behavior: none; max-width: 100%; touch-action: pan-x pan-y; }
button, input, select, textarea { font: inherit; color: inherit; max-width: 100%; }
button { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; border: 0; background: none; text-align: inherit; padding: 0; }
input, textarea, select { font-size: 16px; min-width: 0; }
input[type="date"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.brk { overflow-wrap: anywhere; }
.press { transition: transform 140ms var(--ease), background-color 140ms; }
.press:active { transform: scale(0.97); }
svg { flex: 0 0 auto; }

/* ---------- pantallas apiladas ---------- */
#pantallas { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
.pant { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
.pant:not([data-t="home"]) { box-shadow: -10px 0 30px rgba(0, 0, 0, .14); }
.pant.oculta { visibility: hidden; }
.nav { flex: 0 0 auto; padding-top: env(safe-area-inset-top, 0px); background: var(--bg); border-bottom: 1px solid transparent; transition: border-color 160ms; position: relative; z-index: 2; }
.nav.sc { border-bottom-color: var(--line); }
.nav-in { max-width: 560px; margin: 0 auto; min-height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 max(8px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
.logo { flex: 0 0 auto; min-height: 44px; min-width: 52px; display: grid; place-items: center; border-radius: 10px; }
.logo i { display: block; width: 46px; height: 21px; background: var(--logo) center / contain no-repeat; }
.back { flex: 0 1 auto; min-width: 0; min-height: 44px; display: inline-flex; align-items: center; gap: 0; color: var(--accent-text); font-weight: 500; font-size: 16px; padding-right: 8px; }
.back svg { width: 22px; height: 22px; margin-left: -4px; }
.back span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-t { flex: 1 1 0; min-width: 64px; text-align: center; font: 600 16px/1.1 var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-t.fade { opacity: 0; transition: opacity 160ms; }
.nav.sc .nav-t.fade { opacity: 1; }
.nav-r { flex: 0 0 auto; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: flex-end; }
.nav-r .mas { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--accent-text); }
.nav-r .mas svg { width: 24px; height: 24px; }
.demo { font: 600 11px/1 var(--f-body); background: var(--accent); color: var(--accent-ink); padding: 6px 9px; border-radius: 999px; white-space: nowrap; }
.cuerpo { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--bar-h) + var(--sab) + 24px); }
.cuerpo, .cuerpo * { touch-action: pan-y; }
.sin-bar-pant .cuerpo { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); }
.in { max-width: 560px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.in, .in * { min-width: 0; }
.in { --g: max(16px, env(safe-area-inset-left, 0px)); }
.titulo { font: 700 34px/1.05 var(--f-display); letter-spacing: -0.03em; margin: 6px 0 18px; overflow-wrap: anywhere; }
.titulo.m { font-size: 28px; }
.sec { font: 600 11.5px/1 var(--f-body); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 28px 2px 10px; display: flex; justify-content: space-between; gap: 8px; }
.pie-pant { flex: 0 0 auto; background: var(--bg); border-top: 1px solid var(--line); padding: 8px 0 var(--sab); }

/* avisos */
.note { margin: 10px 0 0; padding: 12px 14px; background: var(--chip); border-radius: 12px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.note.bad { background: var(--bad-bg); color: var(--bad); }
.note button { font-weight: 600; color: var(--accent-text); min-height: 44px; padding: 0 4px; white-space: nowrap; }
.note.bad button { color: var(--bad); }
.msg { margin: 40px 0; text-align: center; color: var(--muted); font-size: 16px; text-wrap: balance; }
.nota { color: var(--muted); font-size: 13px; margin: 12px 2px 0; }
.neg { color: var(--bad); } .pos { color: var(--ok); }
.lbl { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
.sub { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.sub.neg { color: var(--bad); }
.pill { font-size: 13px; padding: 6px 12px; border-radius: 999px; background: var(--chip); color: var(--muted); font-weight: 500; white-space: nowrap; }
.pill b { color: var(--fg); font-weight: 600; }
.pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.warn b { color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.bad b { color: var(--bad); }
.mini-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* resumen general */
.res { background: var(--panel); border-radius: 20px; padding: 16px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; }
.res .cifra { display: block; font: 700 30px/1.1 var(--f-display); letter-spacing: -0.03em; margin-top: 4px; overflow-wrap: anywhere; }
.res .col2 { display: grid; gap: 10px; border-left: 1px solid var(--line); padding-left: 14px; align-content: center; }
.res .c2 { display: block; font: 700 17px/1.15 var(--f-display); letter-spacing: -0.02em; margin-top: 2px; overflow-wrap: anywhere; }

/* tarjeta de obra */
.cards { display: grid; gap: 12px; }
.card { display: block; width: 100%; background: var(--panel); border-radius: 20px; padding: 16px; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card h3 { font: 700 18px/1.2 var(--f-display); margin: 0; letter-spacing: -0.015em; overflow-wrap: anywhere; flex: 1; }
.tag { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; flex: 0 0 auto; }
.tag.on { background: var(--accent); color: var(--accent-ink); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.info { background: var(--info-bg); color: var(--info); }
.tag.late { background: var(--bad-bg); color: var(--bad); }
.plazo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.plazo b { font-weight: 600; color: var(--fg); }
.plazo .late { color: var(--bad); font-weight: 600; }
.bar { display: block; height: 6px; border-radius: 99px; background: var(--chip); margin-top: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar > i.over { background: var(--bad); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.card.activa { box-shadow: inset 0 0 0 1.25px var(--accent); }
.ley { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.ley + .bar { margin-top: 5px; }
.bar.cobro > i { background: var(--ok); }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.trio .big { font-size: 17px; }
.trio .sub { font-size: 11.5px; }
.big { display: block; font: 700 21px/1.15 var(--f-display); letter-spacing: -0.02em; margin-top: 3px; overflow-wrap: anywhere; }
.card { --g-gasto: color-mix(in srgb, var(--fg) 55%, var(--panel)); }
.card .sec2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.card .sec2 b { font: 600 11px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .09em; flex: 0 0 auto; }
.card .sec2 .late { color: var(--bad); }
.card .sep { display: block; height: 1px; background: var(--line); margin-top: 14px; }
.mbar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--chip); margin-top: 8px; }
.mbar i { display: block; height: 100%; flex: 0 0 auto; }
.mbar .g { background: var(--g-gasto); }
.mbar .c { background: var(--ok); }
.mbar .b { background: var(--bad); }
.mbar .f { background: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--fg) 10%, transparent) 5px 10px); }
.ley3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.ley3 .lbl { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.ley3 .lbl::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--dot); flex: 0 0 auto; }
.ley3 .falta .lbl::before { background: repeating-linear-gradient(135deg, var(--chip) 0 2px, color-mix(in srgb, var(--fg) 25%, var(--chip)) 2px 4px); }
.ley3 .big { font-size: 16px; }
.card .cap { display: block; font-size: 12.5px; color: var(--muted); margin-top: 8px; overflow-wrap: anywhere; }
.card .ends { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.util { display: block; margin-top: 10px; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.linea { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px; margin-top: 12px; padding: 0 16px; border-radius: 16px; background: var(--panel); font-weight: 600; }
.linea .n { color: var(--accent-text); }
.linea > span:first-child { display: flex; align-items: center; gap: 8px; }
.linea svg { width: 18px; height: 18px; color: var(--muted); }
.linea.warnl { background: var(--warn-bg); color: var(--warn); }
details.real { background: var(--panel); border-radius: 18px; margin-top: 12px; }
details.real > summary { list-style: none; min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
details.real > summary::-webkit-details-marker { display: none; }
details.real > summary svg { width: 18px; height: 18px; transition: transform 200ms var(--ease); }
details.real[open] > summary svg { transform: rotate(180deg); }
.rrow { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 16px; border-top: 1px solid var(--line); }
.rrow b { font-weight: 600; flex: 1; overflow-wrap: anywhere; }
.rrow span { text-align: right; font-size: 14px; max-width: 55%; overflow-wrap: anywhere; }
.real .nota { padding: 0 16px 14px; margin: 8px 0 0; }
.discreto { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; margin-top: 18px; }
.discreto button { color: var(--muted); font-size: 14px; min-height: 48px; padding: 0 14px; text-decoration: underline; text-underline-offset: 3px; }

/* cabecera de obra */
.cab { background: var(--panel); border-radius: 22px; padding: 16px 16px 14px; margin-top: 4px; }
.cab-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.eyebrow { font: 600 11px/1 var(--f-body); text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-text); }
.cab h1 { font: 700 24px/1.12 var(--f-display); letter-spacing: -0.025em; margin: 10px 0 2px; overflow-wrap: anywhere; }
.cab-s { color: var(--muted); font-size: 14px; margin: 0; overflow-wrap: anywhere; }
.fechas { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin-top: 14px; }
.fecha { display: block; min-height: 52px; padding: 7px 12px; border-radius: 12px; background: var(--bg); }
.fecha b { display: block; font-weight: 600; font-size: 14.5px; overflow-wrap: anywhere; }
.fechas svg { width: 18px; height: 18px; color: var(--muted); }
.cab .plazo { margin-top: 12px; }
.cab .av { margin-top: 12px; display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.cab .av b { color: var(--fg); font-weight: 600; }

/* pestañas */
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 calc(-1 * var(--g)); padding: 12px var(--g) 10px; scrollbar-width: none; overscroll-behavior-x: contain; position: sticky; top: 0; z-index: 3; background: var(--bg); }
.tabs::-webkit-scrollbar { display: none; }
.tabs, .tabs * { touch-action: pan-x pan-y; }
.tabs button { flex: 0 0 auto; min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 600; font-size: 14px; background: var(--chip); color: var(--muted); transition: background-color 160ms, color 160ms; }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }

/* menú de la obra: cuadritos con ícono, todos a la vista */
.menu-o { display: grid; gap: 8px; margin-top: 12px; }
/* v7: el menú va por grupos (Dinero · Obra · Equipo); el nombre del grupo a la izquierda y sus secciones en un renglón */
.mo-g { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 6px; align-items: stretch; }
.mo-t { display: flex; align-items: center; font: 700 10.5px/1.15 var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); overflow-wrap: anywhere; }
.mo-r { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 5px; }
.menu-o button { position: relative; min-height: 52px; border-radius: 13px; background: var(--chip); color: var(--muted); display: grid; place-items: center; align-content: center; gap: 3px; padding: 6px 1px 5px; font-weight: 600; font-size: 11.5px; line-height: 1.1; text-align: center; transition: background-color 160ms, color 160ms; min-width: 0; }
.menu-o button svg { width: 20px; height: 20px; }
.menu-o button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 1px; }
.menu-o button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.mo-r.n5 button { font-size: 11px; letter-spacing: -0.01em; }
@media (max-width: 359px) { .mo-g { grid-template-columns: minmax(0, 1fr); gap: 4px; } .mo-t { padding-left: 2px; } .menu-o:not(.hoja) button { font-size: 10.5px; letter-spacing: -0.02em; } }
/* el mismo menú en hoja (botón «Secciones» de la barra de abajo): más grande, para el pulgar */
.menu-o.hoja { margin-top: 6px; gap: 14px; }
.menu-o.hoja .mo-g { grid-template-columns: minmax(0, 1fr); gap: 6px; }
.menu-o.hoja .mo-t { font-size: 11.5px; padding-left: 2px; }
.menu-o.hoja .mo-r { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.menu-o.hoja button { min-height: 64px; font-size: 12.5px; background: var(--bg); gap: 5px; }
.menu-o.hoja button[aria-selected="true"] { background: var(--fg); }
.menu-o.hoja button svg { width: 23px; height: 23px; }
.menu-o.hoja .mo-r.n5 { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }   /* Dinero trae 5: caben en un renglón, sin dejar «Utilidad» sola abajo */
.menu-o.hoja .mo-r.n5 button { font-size: 12px; }
.sec-n { position: absolute; top: 5px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--info); color: #fff; font: 700 11px/18px var(--f-body); font-style: normal; text-align: center; }
.sec-n.warn { background: var(--warn); } .sec-n.bad { background: var(--bad); }
:root[data-theme="dark"] .sec-n { color: #08131d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sec-n { color: #08131d; } }
/* ---------- v7 · navegación (equipo A) ---------- */
/* barra de abajo dentro de la obra: botón «Secciones» a la izquierda (abre el menú en hoja) */
.bar-in.con-menu { grid-template-columns: 60px 1.25fr 1fr; gap: 10px; }
.bar-in #b-menu { display: none; }
.bar-in.con-menu #b-menu { display: grid; place-items: center; align-content: center; gap: 3px; min-height: 60px; border-radius: 18px; background: var(--chip); color: var(--fg); font: 600 10.5px/1 var(--f-body); }
.bar-in #b-menu svg { width: 22px; height: 22px; }
/* herramientas por secciones (punto 8): cada renglón dice qué es (Buscar · Filtrar · Ver · Acciones) y trae sus botones.
   Sirve para cualquier pestaña: <section class="tools"><div class="tls-r"><span class="tls-t">Filtrar</span><div class="tls-c">…</div></div>…</section> */
.tools { background: var(--panel); border-radius: 18px; padding: 4px 12px; margin-top: 12px; }
.tls-r { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.tls-r:first-child { border-top: 0; }
.tls-t { font: 700 10.5px/1.15 var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.tls-c { min-width: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tools .fil { margin: 0; padding: 0 0 1px; flex: 1 1 100%; min-width: 0; }
.tools .fil.env { flex-wrap: wrap; overflow: visible; }
.tools .fil button { background: var(--bg); min-height: 38px; padding: 0 13px; }
.tools .fil button[aria-pressed="true"] { background: var(--fg); }
.tools .busca { margin: 0; flex: 1 1 100%; background: var(--bg); height: 44px; }
.tools .seg { background: var(--bg); }
.tools .seg button { min-height: 38px; }
.tools .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.tls-b { flex: 1 1 0; min-width: 0; min-height: 44px; border-radius: 12px; background: var(--bg); color: var(--accent-text); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; white-space: nowrap; }
.tls-b.pri { background: var(--accent); color: var(--accent-ink); }
.tls-b svg { width: 17px; height: 17px; }
.tls-b[disabled] { opacity: .45; pointer-events: none; }
/* materiales: palomita general del grupo (todo un proveedor) */
.mgrp-h .mchk { margin-left: 10px; }
.mchk.todo { background: var(--ok); border-color: var(--ok); }
.mchk.parte { border-color: var(--ok); color: var(--ok); }
/* sábado dentro de la obra */
.sab-cab { color: var(--muted); font-size: 14px; margin: 14px 2px 0; }
/* aviso con destino (jueves: sábado de pagos; miércoles: estimación) */
.av-i.con-ir { padding-right: 18px; position: relative; }
.av-i.con-ir::after { content: "›"; position: absolute; right: 2px; top: 50%; transform: translateY(-50%); font-weight: 700; color: var(--warn); }
/* interruptor de un renglón (estimación semanal) */
.sw-r { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; margin-top: 12px; padding: 8px 14px 8px 16px; border-radius: 16px; background: var(--panel); text-align: left; }
.sw-r > span:first-child { display: grid; gap: 2px; min-width: 0; }
.sw-r b { font-weight: 600; }
.sw-r small { color: var(--muted); font-size: 12.5px; }
.sw-r i { flex: 0 0 auto; width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; transition: background-color 160ms; }
.sw-r i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 160ms var(--ease); }
.sw-r[aria-checked="true"] i { background: var(--ok); }
.sw-r[aria-checked="true"] i::after { transform: translateX(18px); }
/* pantalla «Proveedores» (menú de 3 puntitos): un bloque por proveedor, cada material con su último precio y su fecha */
.prov { margin-top: 12px; background: var(--panel); border-radius: 18px; overflow: hidden; }
.prov > summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 10px 14px 10px 16px; cursor: pointer; }
.prov > summary::-webkit-details-marker { display: none; }
.prov > summary > span:first-child { flex: 1; min-width: 0; display: grid; gap: 2px; }
.prov > summary b { font: 700 16px/1.25 var(--f-display); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.prov > summary small { color: var(--muted); font-size: 12.5px; }
.prov > summary svg { width: 18px; height: 18px; color: var(--muted); transition: transform 200ms var(--ease); }
.prov[open] > summary svg { transform: rotate(180deg); }
.prov-c { margin: 0; padding: 0 16px 10px; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.prov-h, .prov-m { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); }
.prov-h { padding: 7px 16px; font: 700 10.5px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); background: var(--chip); }
.prov-m > span { min-width: 0; display: grid; gap: 2px; align-content: start; }
.prov-m b { font-weight: 500; overflow-wrap: anywhere; }
.prov-m small { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.prov-m > .p { text-align: right; justify-items: end; }
.prov-m > .p b { font-weight: 700; white-space: nowrap; }
.prov-m > .p small { white-space: nowrap; }
.cab.chica { padding: 12px 16px; }
.cab.chica .cab-top { align-items: flex-start; }
.cab.chica h1 { font-size: 19px; margin: 0; flex: 1; min-width: 0; }
.cab.chica .cab-s { margin-top: 4px; font-size: 13px; }
.nav-b { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 44px; border-radius: 10px; }
.nav-b span { font: 600 16px/1.1 var(--f-display); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-b small { font: 600 11.5px/1.1 var(--f-body); color: var(--accent-text); }

/* paneles y renglones */
.panel { background: var(--panel); border-radius: 18px; padding: 6px 16px 10px; margin-top: 12px; }
.panel h3 { font: 600 11.5px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 14px 0 4px; overflow-wrap: anywhere; }
.tiles { display: grid; gap: 8px; margin: 8px 0 4px; }
.tiles.t3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tiles.t2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile { background: var(--bg); border-radius: 14px; padding: 10px 11px; min-width: 0; }
.tile .lbl { display: block; font-size: 12px; color: var(--muted); }
.tile b { display: block; font: 700 18px/1.15 var(--f-display); letter-spacing: -0.02em; margin-top: 3px; overflow-wrap: anywhere; }
.tile.pos b { color: var(--ok); } .tile.neg b { color: var(--bad); }
.ley1 { display: block; font-size: 12.5px; color: var(--muted); margin: 4px 0 6px; }
.hero { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 6px 0 10px; }
.hero b { font: 700 28px/1.1 var(--f-display); letter-spacing: -0.03em; color: var(--ok); }
.hero.neg b { color: var(--bad); }
.hero span { color: var(--muted); font-size: 14px; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row > span:first-child { color: var(--muted); font-size: 14px; flex: 1; }
.row > .v { font-weight: 600; text-align: right; overflow-wrap: anywhere; max-width: 62%; }
.row.key > .v { font: 700 18px var(--f-display); }
.fuente { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.mini { min-height: 44px; padding: 0 14px; border-radius: 12px; background: var(--chip); font-weight: 600; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; }
.mini.ok { background: var(--ok-bg); color: var(--ok); }
.ghost { display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 16px; color: var(--accent-text); font-weight: 600; background: var(--chip); margin-top: 12px; }
.ghost svg { width: 18px; height: 18px; }
.ghost.pri { background: var(--accent); color: var(--accent-ink); }
.edit { display: flex; gap: 8px; align-items: center; width: 100%; padding: 8px 0 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.edit input { flex: 1 1 120px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; }
.day { font: 600 13px var(--f-display); color: var(--muted); margin: 18px 2px 6px; display: flex; justify-content: space-between; gap: 8px; }
.day > span:first-child::first-letter { text-transform: uppercase; }
.list { background: var(--panel); border-radius: 16px; overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 14px; }
.ico { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 10px; background: var(--chip); display: grid; place-items: center; color: var(--accent-text); }
.ico.gris { color: var(--muted); }
.ico svg { width: 22px; height: 22px; }
.item .t { flex: 1; }
.item .t b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; overflow-wrap: anywhere; }
.item .t small { display: block; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.item .t small.obs { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.item .m { font-weight: 600; text-align: right; flex: 0 0 auto; max-width: 42%; overflow-wrap: anywhere; }
.item > svg { width: 18px; height: 18px; color: var(--muted); flex: 0 0 auto; }
.tg { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; display: inline-block; vertical-align: 1px; }
.tg.me_debe { background: var(--bad-bg); color: var(--bad); }
.tg.por_pagar { background: var(--warn-bg); color: var(--warn); }
.tg.por_recuperar { background: var(--info-bg); color: var(--info); }
.tg.saldado { background: var(--ok-bg); color: var(--ok); }
.tg.neutro { background: var(--chip); color: var(--muted); }
.chipsum { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chipsum span { background: var(--panel); border-radius: 12px; padding: 8px 12px; font-size: 13px; color: var(--muted); }
.chipsum b { color: var(--fg); font-weight: 600; display: block; font-size: 15px; overflow-wrap: anywhere; }
.prog { height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; margin: 8px 0 2px; }
.prog > i { display: block; height: 100%; background: var(--accent); }
.prog > i.over { background: var(--bad); }
.seg { display: inline-flex; background: var(--chip); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { min-height: 40px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); }
.bar2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
.fil { display: flex; gap: 6px; overflow-x: auto; margin: 10px calc(-1 * var(--g)) 0; padding: 0 var(--g) 2px; scrollbar-width: none; overscroll-behavior-x: contain; }
.fil::-webkit-scrollbar { display: none; }
.fil, .fil * { touch-action: pan-x pan-y; }
.fil button { flex: 0 0 auto; min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--chip); font-size: 14px; font-weight: 500; color: var(--muted); max-width: 70vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fil button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 600; }
.busca { display: flex; align-items: center; gap: 8px; margin-top: 6px; height: 46px; border-radius: 14px; background: var(--chip); padding: 0 12px; color: var(--muted); }
.busca svg { width: 20px; height: 20px; }
.busca input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; color: var(--fg); -webkit-appearance: none; appearance: none; }
.busca input::placeholder { color: var(--muted); }
.tbl-foot { display: flex; justify-content: space-between; gap: 12px; padding: 12px 4px 0; font-weight: 600; flex-wrap: wrap; }
.tbl-box { margin-top: 12px; background: var(--panel); border-radius: 16px; overflow-x: auto; overscroll-behavior-x: contain; max-width: 100%; }
.tbl-box, .tbl-box * { touch-action: pan-x pan-y; }
table { border-collapse: separate; border-spacing: 0; min-width: 600px; width: 100%; font-size: 13.5px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12.5px; padding: 10px 12px; white-space: nowrap; background: var(--panel); }
td { padding: 0 12px; height: 52px; border-top: 1px solid var(--line); white-space: nowrap; }
td.r, th.r { text-align: right; }
tr[data-act] { cursor: pointer; }
tr[data-act]:active td { background: var(--chip); }
th:first-child, td:first-child { position: sticky; left: 0; background: var(--panel); z-index: 1; }
td.cc { max-width: 210px; overflow: hidden; text-overflow: ellipsis; }

/* esqueleto */
.sk { background: var(--panel); border-radius: 18px; height: 168px; margin-top: 12px; animation: pulso 1.2s ease-in-out infinite alternate; }
.sk.s { height: 96px; margin-top: 0; border-radius: 20px; }
.sk.t { height: 40px; width: 55%; border-radius: 10px; margin: 8px 0 18px; }
@keyframes pulso { from { opacity: .55; } to { opacity: 1; } }

/* deslizar para quitar */
.sw { position: relative; overflow: hidden; border-top: 1px solid var(--line); }
.list > .sw:first-child { border-top: 0; }
.sw-act { position: absolute; top: 0; bottom: 0; right: 0; display: flex; width: var(--w); }
.sa { flex: 1; color: #fff; font-weight: 600; font-size: 14px; display: grid; place-items: center; }
.sa.del { background: #c4372e; } .sa.ok { background: #1f8a50; }
.sw-f { position: relative; background: var(--panel); transform: translateX(0); will-change: transform; }
.sw-f, .sw-f * { touch-action: pan-y; }
.sw-f.snap { transition: transform 260ms var(--ease-sheet); }

/* detalle de cotización */
.tot3 { display: grid; gap: 0; }
.cpart { margin-top: 22px; }
.cpart-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 0 2px 8px; }
.cpart-h h3 { font: 700 15px/1.25 var(--f-display); margin: 0; overflow-wrap: anywhere; flex: 1; }
.cpart-h span { font-weight: 600; font-size: 14px; }
.cpart-h { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-top: 8px; }
.rubro { margin: 0; padding: 12px 14px 4px; font: 700 11.5px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); border-left: 3px solid var(--accent); background: var(--panel); }
.list > .rubro-g:first-child .rubro { border-top-left-radius: 0; }
.cpt { padding: 13px 16px; border-top: 1px solid var(--line); }
.cpt:first-child { border-top: 0; }
.clave { font: 600 11.5px/1 var(--f-body); letter-spacing: .06em; color: var(--accent-text); text-transform: uppercase; overflow-wrap: anywhere; }
.ctxt { margin: 5px 0 7px; font-size: 14.5px; line-height: 1.42; overflow-wrap: anywhere; }
.ccalc { display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; font-size: 13.5px; color: var(--muted); }
.ccalc b { color: var(--fg); font-weight: 600; }
.cons { margin: 0; padding: 4px 16px 12px 36px; display: grid; gap: 8px; font-size: 14.5px; }
.cons li { overflow-wrap: anywhere; padding-left: 2px; }

/* estimación */
.cpt.est { padding: 14px 16px 16px; }
.cpt-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ant { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.ctxt.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.ctxt.clamp.abierto { display: block; -webkit-line-clamp: unset; overflow: visible; }
.cpt-in { display: flex; align-items: center; gap: 10px; }
.pct-in { display: flex; align-items: center; gap: 4px; width: 104px; height: 48px; border-radius: 12px; background: var(--bg); padding: 0 12px; flex: 0 0 auto; }
.pct-in input { flex: 1; width: 100%; border: 0; background: none; outline: none; font: 700 20px var(--f-display); font-variant-numeric: tabular-nums; height: 100%; text-align: right; -webkit-appearance: none; appearance: none; }
.pct-in span { font-weight: 600; color: var(--muted); }
.pct-in:focus-within { outline: 2px solid var(--accent-text); }
.cpt-out { flex: 1; font-size: 13px; color: var(--muted); text-align: right; overflow-wrap: anywhere; }
.cpt-out b { display: block; color: var(--fg); font-size: 15px; font-weight: 600; }
.qch { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 6px; margin-top: 10px; }
.acc.hold { position: relative; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.acc.hold .hold-f { position: absolute; inset: 0; width: 0; background: rgba(255, 255, 255, .35); }
.acc.hold.cargando .hold-f { width: 100%; transition: width var(--hold, 3000ms) linear; }
.acc.hold .hold-t { position: relative; }
.libs { display: grid; gap: 2px; }
.lib { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.libs .lib:first-child { border-top: 0; }
.lib .chk { flex: 0 0 auto; width: 28px; height: 28px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; font-weight: 700; color: var(--accent-ink); background: transparent; }
.lib.hecho .chk { background: var(--accent); }
.lib .t { flex: 1; min-width: 0; text-align: left; display: grid; gap: 2px; }
.lib .t b { font-weight: 600; overflow-wrap: anywhere; }
.lib .t small { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.lib .t small.obs { color: var(--fg); opacity: .8; }
.lib.hecho .t b { text-decoration: line-through; color: var(--muted); }
.qch .qprev { padding: 0 10px; font-size: 13px; color: var(--muted); background: transparent; border: 1px solid var(--line); white-space: nowrap; }
.qch button { min-height: 44px; border-radius: 12px; background: var(--chip); font-weight: 600; font-size: 14px; text-align: center; }
.qch button[disabled], .pct-in input[disabled] { opacity: .45; pointer-events: none; }
.av-c { margin: 8px 0 0; font-size: 13px; color: var(--warn); background: var(--warn-bg); border-radius: 10px; padding: 7px 10px; }
.tot-e { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.tot-e span { font-size: 12px; color: var(--muted); display: block; }
.tot-e b { display: block; font: 700 15px var(--f-display); color: var(--fg); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.tot-e div:last-child b { color: var(--accent-text); }
.bot2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fld { display: block; width: 100%; min-height: 48px; border-radius: 12px; border: 0; background: var(--panel); padding: 12px 14px; }

/* anotar rápido: burbuja y chat */
.burbuja { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--bar-h) + var(--sab) + 72px); z-index: 30; width: 50px; height: 50px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0, 0, 0, .28), inset 0 0 0 2px var(--accent); touch-action: none; transition: transform 140ms var(--ease); background: #0b1d2f; }
.burbuja-logo { display: block; width: 36px; height: 17px; margin: 0; transform: translateY(-1px); background: var(--logo) center / contain no-repeat; }
.sin-bar .burbuja { bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
.burbuja.arrastra { transform: scale(1.08); box-shadow: 0 10px 28px rgba(0, 0, 0, .35), inset 0 0 0 2px var(--accent); }
.burbuja[hidden], .chat[hidden], .chat-veil[hidden] { display: none; }
/* ver como supervisor (dueño): franja fija arriba; las pantallas bajan debajo de ella */
.franja-vista { position: fixed; top: 0; left: 0; right: 0; z-index: 70; height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 600; }

}
