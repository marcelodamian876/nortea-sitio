<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Obras NORTEA</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/obras/manifest.webmanifest">
<link rel="icon" href="/assets/img/marca/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/img/marca/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obras NORTEA">
<style>html,body{margin:0;padding:0;height:100%}</style>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f0e8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08131d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" media="print" onload="this.media='all'">
</head>
<body>
<style>
/* Concepto: libreta de obra con pantallas por niveles, como en iOS. Inicio, Obra y Detalle se apilan: la nueva entra por la derecha, la anterior se corre un poco, y se regresa con el botón, con el gesto desde el borde o con «atrás» del sistema. Marino, dorado y crema; el dorado solo en lo principal. */
:root {
  --bg: #f3f0e8; --fg: #0b1d2f; --muted: #55606b; --panel: #faf8f3; --line: #ddd7c9; --chip: #ebe6da;
  --accent: #b8893a; --accent-ink: #0b1d2f; --accent-text: #86601b; --oro-claro: #e8c777;
  --ok: #1a7a45; --ok-bg: #dcefe3; --bad: #b3261e; --bad-bg: #f6e1de;
  --warn: #8a5a00; --warn-bg: #f7ead0; --info: #1f5fa8; --info-bg: #dce8f6;
  --scrim: rgba(11, 29, 47, .45); --toast-btn: #e8c777; --nav-bg: rgba(243, 240, 232, .86);
  --f-display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(0.23, 1, 0.32, 1); --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
  --bar-h: 76px; --logo: none; --sab: max(8px, calc(env(safe-area-inset-bottom, 0px) - 16px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08131d; --fg: #ece8dc; --muted: #9aa5ae; --panel: #0f2133; --line: #1f3347; --chip: #172a3d;
    --accent: #c99a45; --accent-ink: #0b1d2f; --accent-text: #dcb066; --oro-claro: #e8c777;
    --ok: #4cd08a; --ok-bg: #123524; --bad: #ff8a80; --bad-bg: #3a1d22;
    --warn: #f0b95a; --warn-bg: #3a2d12; --info: #8fb6ee; --info-bg: #14283f;
    --scrim: rgba(0, 0, 0, .6); --toast-btn: #8a6420; --nav-bg: rgba(8, 19, 29, .86); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08131d; --fg: #ece8dc; --muted: #9aa5ae; --panel: #0f2133; --line: #1f3347; --chip: #172a3d;
  --accent: #c99a45; --accent-ink: #0b1d2f; --accent-text: #dcb066; --oro-claro: #e8c777;
  --ok: #4cd08a; --ok-bg: #123524; --bad: #ff8a80; --bad-bg: #3a1d22;
  --warn: #f0b95a; --warn-bg: #3a2d12; --info: #8fb6ee; --info-bg: #14283f;
  --scrim: rgba(0, 0, 0, .6); --toast-btn: #8a6420; --nav-bg: rgba(8, 19, 29, .86); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; touch-action: manipulation; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overflow: hidden; overscroll-behavior: none; max-width: 100%; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); height: 100%; overflow: hidden; overscroll-behavior: none; max-width: 100%; touch-action: pan-x pan-y; }
button, input, select, textarea { font: inherit; color: inherit; max-width: 100%; }
button { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; border: 0; background: none; text-align: inherit; padding: 0; }
input, textarea, select { font-size: 16px; min-width: 0; }
input[type="date"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.brk { overflow-wrap: anywhere; }
.press { transition: transform 140ms var(--ease), background-color 140ms; }
.press:active { transform: scale(0.97); }
svg { flex: 0 0 auto; }

/* ---------- pantallas apiladas ---------- */
#pantallas { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
.pant { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
.pant:not([data-t="home"]) { box-shadow: -10px 0 30px rgba(0, 0, 0, .14); }
.pant.oculta { visibility: hidden; }
.nav { flex: 0 0 auto; padding-top: env(safe-area-inset-top, 0px); background: var(--bg); border-bottom: 1px solid transparent; transition: border-color 160ms; position: relative; z-index: 2; }
.nav.sc { border-bottom-color: var(--line); }
.nav-in { max-width: 560px; margin: 0 auto; min-height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 max(8px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
.logo { flex: 0 0 auto; min-height: 44px; min-width: 52px; display: grid; place-items: center; border-radius: 10px; }
.logo i { display: block; width: 46px; height: 21px; background: var(--logo) center / contain no-repeat; }
.back { flex: 0 1 auto; min-width: 0; min-height: 44px; display: inline-flex; align-items: center; gap: 0; color: var(--accent-text); font-weight: 500; font-size: 16px; padding-right: 8px; }
.back svg { width: 22px; height: 22px; margin-left: -4px; }
.back span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-t { flex: 1 1 0; min-width: 64px; text-align: center; font: 600 16px/1.1 var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-t.fade { opacity: 0; transition: opacity 160ms; }
.nav.sc .nav-t.fade { opacity: 1; }
.nav-r { flex: 0 0 auto; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: flex-end; }
.nav-r .mas { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--accent-text); }
.nav-r .mas svg { width: 24px; height: 24px; }
.demo { font: 600 11px/1 var(--f-body); background: var(--accent); color: var(--accent-ink); padding: 6px 9px; border-radius: 999px; white-space: nowrap; }
.cuerpo { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--bar-h) + var(--sab) + 24px); }
.cuerpo, .cuerpo * { touch-action: pan-y; }
.sin-bar-pant .cuerpo { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); }
.in { max-width: 560px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.in, .in * { min-width: 0; }
.in { --g: max(16px, env(safe-area-inset-left, 0px)); }
.titulo { font: 700 34px/1.05 var(--f-display); letter-spacing: -0.03em; margin: 6px 0 18px; overflow-wrap: anywhere; }
.titulo.m { font-size: 28px; }
.sec { font: 600 11.5px/1 var(--f-body); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 28px 2px 10px; display: flex; justify-content: space-between; gap: 8px; }
.pie-pant { flex: 0 0 auto; background: var(--bg); border-top: 1px solid var(--line); padding: 8px 0 var(--sab); }

/* avisos */
.note { margin: 10px 0 0; padding: 12px 14px; background: var(--chip); border-radius: 12px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.note.bad { background: var(--bad-bg); color: var(--bad); }
.note button { font-weight: 600; color: var(--accent-text); min-height: 44px; padding: 0 4px; white-space: nowrap; }
.note.bad button { color: var(--bad); }
.msg { margin: 40px 0; text-align: center; color: var(--muted); font-size: 16px; text-wrap: balance; }
.nota { color: var(--muted); font-size: 13px; margin: 12px 2px 0; }
.neg { color: var(--bad); } .pos { color: var(--ok); }
.lbl { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
.sub { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.sub.neg { color: var(--bad); }
.pill { font-size: 13px; padding: 6px 12px; border-radius: 999px; background: var(--chip); color: var(--muted); font-weight: 500; white-space: nowrap; }
.pill b { color: var(--fg); font-weight: 600; }
.pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.warn b { color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.bad b { color: var(--bad); }
.mini-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* resumen general */
.res { background: var(--panel); border-radius: 20px; padding: 16px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; }
.res .cifra { display: block; font: 700 30px/1.1 var(--f-display); letter-spacing: -0.03em; margin-top: 4px; overflow-wrap: anywhere; }
.res .col2 { display: grid; gap: 10px; border-left: 1px solid var(--line); padding-left: 14px; align-content: center; }
.res .c2 { display: block; font: 700 17px/1.15 var(--f-display); letter-spacing: -0.02em; margin-top: 2px; overflow-wrap: anywhere; }

/* tarjeta de obra */
.cards { display: grid; gap: 12px; }
.card { display: block; width: 100%; background: var(--panel); border-radius: 20px; padding: 16px; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card h3 { font: 700 18px/1.2 var(--f-display); margin: 0; letter-spacing: -0.015em; overflow-wrap: anywhere; flex: 1; }
.tag { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; flex: 0 0 auto; }
.tag.on { background: var(--accent); color: var(--accent-ink); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.info { background: var(--info-bg); color: var(--info); }
.tag.late { background: var(--bad-bg); color: var(--bad); }
.plazo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.plazo b { font-weight: 600; color: var(--fg); }
.plazo .late { color: var(--bad); font-weight: 600; }
.bar { display: block; height: 6px; border-radius: 99px; background: var(--chip); margin-top: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar > i.over { background: var(--bad); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.card.activa { box-shadow: inset 0 0 0 1.25px var(--accent); }
.ley { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.ley + .bar { margin-top: 5px; }
.bar.cobro > i { background: var(--ok); }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.trio .big { font-size: 17px; }
.trio .sub { font-size: 11.5px; }
.big { display: block; font: 700 21px/1.15 var(--f-display); letter-spacing: -0.02em; margin-top: 3px; overflow-wrap: anywhere; }
.util { display: block; margin-top: 10px; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.linea { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px; margin-top: 12px; padding: 0 16px; border-radius: 16px; background: var(--panel); font-weight: 600; }
.linea .n { color: var(--accent-text); }
.linea > span:first-child { display: flex; align-items: center; gap: 8px; }
.linea svg { width: 18px; height: 18px; color: var(--muted); }
.linea.warnl { background: var(--warn-bg); color: var(--warn); }
details.real { background: var(--panel); border-radius: 18px; margin-top: 12px; }
details.real > summary { list-style: none; min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
details.real > summary::-webkit-details-marker { display: none; }
details.real > summary svg { width: 18px; height: 18px; transition: transform 200ms var(--ease); }
details.real[open] > summary svg { transform: rotate(180deg); }
.rrow { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 16px; border-top: 1px solid var(--line); }
.rrow b { font-weight: 600; flex: 1; overflow-wrap: anywhere; }
.rrow span { text-align: right; font-size: 14px; max-width: 55%; overflow-wrap: anywhere; }
.real .nota { padding: 0 16px 14px; margin: 8px 0 0; }
.discreto { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; margin-top: 18px; }
.discreto button { color: var(--muted); font-size: 14px; min-height: 48px; padding: 0 14px; text-decoration: underline; text-underline-offset: 3px; }

/* cabecera de obra */
.cab { background: var(--panel); border-radius: 22px; padding: 16px 16px 14px; margin-top: 4px; }
.cab-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.eyebrow { font: 600 11px/1 var(--f-body); text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-text); }
.cab h1 { font: 700 24px/1.12 var(--f-display); letter-spacing: -0.025em; margin: 10px 0 2px; overflow-wrap: anywhere; }
.cab-s { color: var(--muted); font-size: 14px; margin: 0; overflow-wrap: anywhere; }
.fechas { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin-top: 14px; }
.fecha { display: block; min-height: 52px; padding: 7px 12px; border-radius: 12px; background: var(--bg); }
.fecha b { display: block; font-weight: 600; font-size: 14.5px; overflow-wrap: anywhere; }
.fechas svg { width: 18px; height: 18px; color: var(--muted); }
.cab .plazo { margin-top: 12px; }
.cab .av { margin-top: 12px; display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.cab .av b { color: var(--fg); font-weight: 600; }

/* pestañas */
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 calc(-1 * var(--g)); padding: 12px var(--g) 10px; scrollbar-width: none; overscroll-behavior-x: contain; position: sticky; top: 0; z-index: 3; background: var(--bg); }
.tabs::-webkit-scrollbar { display: none; }
.tabs, .tabs * { touch-action: pan-x pan-y; }
.tabs button { flex: 0 0 auto; min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 600; font-size: 14px; background: var(--chip); color: var(--muted); transition: background-color 160ms, color 160ms; }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }

/* paneles y renglones */
.panel { background: var(--panel); border-radius: 18px; padding: 6px 16px 10px; margin-top: 12px; }
.panel h3 { font: 600 11.5px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 14px 0 4px; overflow-wrap: anywhere; }
.tiles { display: grid; gap: 8px; margin: 8px 0 4px; }
.tiles.t3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tiles.t2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile { background: var(--bg); border-radius: 14px; padding: 10px 11px; min-width: 0; }
.tile .lbl { display: block; font-size: 12px; color: var(--muted); }
.tile b { display: block; font: 700 18px/1.15 var(--f-display); letter-spacing: -0.02em; margin-top: 3px; overflow-wrap: anywhere; }
.tile.pos b { color: var(--ok); } .tile.neg b { color: var(--bad); }
.ley1 { display: block; font-size: 12.5px; color: var(--muted); margin: 4px 0 6px; }
.hero { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 6px 0 10px; }
.hero b { font: 700 28px/1.1 var(--f-display); letter-spacing: -0.03em; color: var(--ok); }
.hero.neg b { color: var(--bad); }
.hero span { color: var(--muted); font-size: 14px; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row > span:first-child { color: var(--muted); font-size: 14px; flex: 1; }
.row > .v { font-weight: 600; text-align: right; overflow-wrap: anywhere; max-width: 62%; }
.row.key > .v { font: 700 18px var(--f-display); }
.fuente { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.mini { min-height: 44px; padding: 0 14px; border-radius: 12px; background: var(--chip); font-weight: 600; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; }
.mini.ok { background: var(--ok-bg); color: var(--ok); }
.ghost { display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 16px; color: var(--accent-text); font-weight: 600; background: var(--chip); margin-top: 12px; }
.ghost svg { width: 18px; height: 18px; }
.ghost.pri { background: var(--accent); color: var(--accent-ink); }
.edit { display: flex; gap: 8px; align-items: center; width: 100%; padding: 8px 0 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.edit input { flex: 1 1 120px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; }
.day { font: 600 13px var(--f-display); color: var(--muted); margin: 18px 2px 6px; text-transform: capitalize; display: flex; justify-content: space-between; gap: 8px; }
.list { background: var(--panel); border-radius: 16px; overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 14px; }
.ico { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 10px; background: var(--chip); display: grid; place-items: center; color: var(--accent-text); }
.ico.gris { color: var(--muted); }
.ico svg { width: 22px; height: 22px; }
.item .t { flex: 1; }
.item .t b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; overflow-wrap: anywhere; }
.item .t small { display: block; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.item .t small.obs { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.item .m { font-weight: 600; text-align: right; flex: 0 0 auto; max-width: 42%; overflow-wrap: anywhere; }
.tg { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; display: inline-block; vertical-align: 1px; }
.tg.me_debe { background: var(--bad-bg); color: var(--bad); }
.tg.por_pagar { background: var(--warn-bg); color: var(--warn); }
.tg.por_recuperar { background: var(--info-bg); color: var(--info); }
.tg.saldado { background: var(--ok-bg); color: var(--ok); }
.tg.neutro { background: var(--chip); color: var(--muted); }
.chipsum { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chipsum span { background: var(--panel); border-radius: 12px; padding: 8px 12px; font-size: 13px; color: var(--muted); }
.chipsum b { color: var(--fg); font-weight: 600; display: block; font-size: 15px; overflow-wrap: anywhere; }
.prog { height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; margin: 8px 0 2px; }
.prog > i { display: block; height: 100%; background: var(--accent); }
.prog > i.over { background: var(--bad); }
.seg { display: inline-flex; background: var(--chip); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { min-height: 40px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); }
.bar2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
.fil { display: flex; gap: 6px; overflow-x: auto; margin: 10px calc(-1 * var(--g)) 0; padding: 0 var(--g) 2px; scrollbar-width: none; overscroll-behavior-x: contain; }
.fil::-webkit-scrollbar { display: none; }
.fil, .fil * { touch-action: pan-x pan-y; }
.fil button { flex: 0 0 auto; min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--chip); font-size: 14px; font-weight: 500; color: var(--muted); max-width: 70vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fil button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 600; }
.busca { display: flex; align-items: center; gap: 8px; margin-top: 6px; height: 46px; border-radius: 14px; background: var(--chip); padding: 0 12px; color: var(--muted); }
.busca svg { width: 20px; height: 20px; }
.busca input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; color: var(--fg); -webkit-appearance: none; appearance: none; }
.busca input::placeholder { color: var(--muted); }

// ============================================================
// Datos: lo único que toca la base. Mañana, con Google Drive,
// solo se cambia este objeto; el resto de la página no sabe de dónde vienen los datos.
//   Datos.iniciar()                      -> { modo, sinCuenta }
//   Datos.suscribir(col, alRecibir, alFallar) -> función para dejar de escuchar
//   Datos.nuevoId(col)
//   Datos.crear(col, id, datos) / actualizar(col, id, campos) / borrar(col, id)

// Colecciones: obras, gastos, pagos, estimaciones.
// ============================================================
const Datos = (() => {
  const COLS = ["obras", "gastos", "pagos", "estimaciones", "pendientes"], BASE = ["obras", "gastos", "pagos", "estimaciones"];
  const mem = {}, subs = {};
  COLS.forEach((c) => { mem[c] = {}; subs[c] = new Set(); });
  let lentoFn = null, url = ls.get("nortea_api"), llave = ls.get("nortea_llave"), ultimo = 0, leyendo = null, servidor = Number(ls.get("nortea_srv") || 1);
  // versión del código de la hoja: la 1 solo guarda las cuatro colecciones de base; desde la 2, cualquiera (p. ej. pendientes)
  const soporta = (col) => BASE.includes(col) || servidor >= 2;
  const emitir = (c) => subs[c].forEach((s) => s.ok({ ...mem[c] }));
  function cargarCache() {
    try { const c = JSON.parse(localStorage.getItem("nortea_cache") || "null"); if (c) COLS.forEach((k) => (mem[k] = c[k] || {})); return !!c; } catch { return false; }
  }
  function guardarCache() { try { localStorage.setItem("nortea_cache", JSON.stringify(mem)); } catch {} }
  async function api(cuerpo, ms) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 20000);
    try {
      const r = await fetch(url, { method: "POST", body: JSON.stringify({ ...cuerpo, llave }), headers: { "Content-Type": "text/plain;charset=utf-8" }, signal: ctl.signal, redirect: "follow" });
      const t = await r.text();
      try { return JSON.parse(t); } catch { const e = new Error("html"); e.html = true; e.texto = t.slice(0, 400); throw e; }
    } finally { clearTimeout(t); }
  }
  async function refrescar() {
    if (leyendo) return leyendo;
    leyendo = (async () => {
      try {
        const r = await api({ accion: "leer" }, 60000);
        if (!r || !r.ok) { if (r && r.error === "llave") pedirConfig("La llave ya no es válida. Escríbela otra vez."); return false; }
        servidor = Number(r.version || 1); ls.set("nortea_srv", String(servidor));
        COLS.forEach((c) => { const m = {}; Object.entries((r.datos || {})[c] || {}).forEach(([id, d]) => (m[id] = { ...d, id })); mem[c] = m; });
        guardarCache(); ultimo = Date.now(); COLS.forEach(emitir); if (lentoFn) lentoFn(false);
        return true;
      } catch { if (lentoFn) lentoFn(true); return false; }
      finally { leyendo = null; }
    })();
    return leyendo;
  }
  // ---- pantalla de una sola vez: dirección del script y llave ----
  function pedirConfig(msg) {
    return new Promise((res) => {
      let v = document.getElementById("conf-nortea"); if (v) v.remove();
      v = document.createElement("div"); v.id = "conf-nortea";
      v.innerHTML = `<form style="position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:20px;background:var(--bg,#0b1d2f)">
        <div style="width:min(420px,100%);display:grid;gap:12px;font:15px/1.4 system-ui,sans-serif;color:var(--fg,#fff)">
          <h1 style="margin:0;font-size:24px">Obras NORTEA</h1>
          <p style="margin:0;opacity:.8">${msg || "Solo la primera vez: pega la dirección de tu hoja (la que termina en /exec) y tu llave."}</p>
          <input name="u" required placeholder="https://script.google.com/macros/s/…/exec" value="${esc(url || "")}" autocomplete="off" style="font-size:16px;padding:12px;border-radius:10px;border:1px solid #888">
          <input name="k" required placeholder="Llave" value="${esc(llave || "")}" autocomplete="off" style="font-size:16px;padding:12px;border-radius:10px;border:1px solid #888">
          <button style="font-size:16px;padding:13px;border-radius:12px;border:0;background:#b8893a;color:#0b1d2f;font-weight:700">Entrar</button>
          <p class="e" style="margin:0;color:#ff8a8a"></p></div></form>`;
      document.body.appendChild(v);
      v.querySelector("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.target, err = f.querySelector(".e");
        url = (f.u.value.match(/https:\/\/script\.google\.com\/[^\s"'<>]+/) || [f.u.value.trim()])[0].replace(/[?#].*$/, "");
        llave = f.k.value.trim().replace(/^.*llave:\s*/i, "").replace(/\s+/g, "");
        f.u.value = url; f.k.value = llave;
        if (!/^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[^/]+\/exec$/.test(url)) {
          err.textContent = /\/dev$/.test(url) ? "Esa es la dirección de prueba (/dev). Usa la de la implementación, la que termina en /exec." : "La dirección debe empezar con https://script.google.com/macros/s/ y terminar en /exec.";
          return;
        }
        f.querySelector(".e").textContent = "Probando…";
        try {
          const r = await api({ accion: "leer", cols: ["obras"] }, 30000);
          if (!r || !r.ok) { err.textContent = r && r.error === "llave" ? "La llave no coincide. Cópiala otra vez del «Registro de ejecución» (solo las letras y números)." : "La hoja contestó con un error: " + ((r && r.error) || "sin detalle"); return; }
        } catch (x) {
          if (!navigator.onLine) err.textContent = "No tienes señal. Inténtalo cuando tengas internet.";
          else if (x && x.html) err.textContent = /doGet|doPost|funci[oó]n/i.test(x.texto || "") ? "Google no encuentra el código. En Apps Script guarda el código y vuelve a implementar (Administrar implementaciones → ✏️ → Nueva versión)." : "Google contestó con una página en vez de datos. En Apps Script: Implementar → Administrar implementaciones → ✏️ → «Ejecutar como: Yo» y «Quién tiene acceso: Cualquier usuario» → Nueva versión → Implementar.";
          else err.textContent = "Google no dejó entrar a la app. En Apps Script: Implementar → Administrar implementaciones → ✏️ → «Quién tiene acceso: Cualquier usuario» (no «con cuenta de Google») → Nueva versión → Implementar. Prueba: abre tu dirección /exec en Safari; debe salir {\"ok\":true…}.";
          return;
        }
        ls.set("nortea_api", url); ls.set("nortea_llave", llave); v.remove(); res(); refrescar();
      });
    });
  }
  async function iniciar() {
    const hay = cargarCache();
    if (!url || !llave) await pedirConfig();
    else refrescar();
    if (!hay) setTimeout(() => { if (!ultimo && lentoFn) lentoFn(true); }, 10000);
    // vuelve a leer al regresar a la app y cada minuto mientras está abierta
    document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - ultimo > 15000) refrescar(); });
    setInterval(() => { if (!document.hidden) refrescar(); }, 120000);
    return { modo: "real", sinCuenta: false };
  }
  function suscribir(col, alRecibir) {
    const s = { ok: alRecibir }; subs[col].add(s);
    Promise.resolve().then(() => alRecibir({ ...mem[col] }));
    return () => subs[col].delete(s);
  }
  const nuevoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  async function escribir(op, col, id, data) {
    if (!url || !llave) return "sin_senal";
    if (!soporta(col)) return "error";
    try {
      const r = await api({ accion: "escribir", ops: [{ op, col, id, data }] }, 20000);
      if (!r || !r.ok) { if (r && r.error === "llave") { pedirConfig("La llave ya no es válida. Escríbela otra vez."); return "denegado"; } return "error"; }
      if (op === "del") delete mem[col][id];
      else if (op === "update") mem[col][id] = { ...(mem[col][id] || {}), ...data, id };
      else mem[col][id] = { ...data, id };
      guardarCache(); emitir(col);
      return "ok";
    } catch { return "sin_senal"; }
  }
  return {
    get modo() { return "real"; }, get soloLectura() { return false; },
    alLento(fn) { lentoFn = fn; },
    iniciar, suscribir, nuevoId, refrescar, soporta,
    crear: (col, id, datos) => escribir("set", col, id, datos),
    actualizar: (col, id, campos) => escribir("update", col, id, campos),
    borrar: (col, id) => escribir("del", col, id, null),
  };
})();

function calc(o) {

  const por_cobrar = est(o) === "por_empezar" ? 0 : falta_cobrar;
  const por_pagar = sum(gs.filter((g) => g.marca === "por_pagar" && !g.resuelto), "monto");
  const me_deben = sum(gs.filter((g) => g.marca === "me_debe" && !g.resuelto), "monto");
  const por_recuperar = sum(gs.filter((g) => g.marca === "por_recuperar" && !g.resuelto), "monto");

  }
  else if (a === "acc") { const it = F && F.items[Number(el.dataset.i)]; cerrarHoja(true); if (it) setTimeout(it.fn, 0); }
  else if (a === "saldar-p") { saldar(el.dataset.id, true); }

  else if (a === "guardar") guardar();
  else if (a === "borrar") borrar();
  else if (a === "sw-borrar") { cerrarFila(); borrarDoc(el.dataset.col, el.dataset.id); }

  else if (a === "costo-cancelar") { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); S.editCosto = null; S.costoErr = null; if (p) { p.sucio = false; pintarTab(p); } }
  else if (a === "costo-guardar") guardarCosto();
  else if (a === "q") { if (!ES) return; const i = Number(el.dataset.i), k = ES.cs[i], n = Number(el.dataset.n); const v = el.dataset.m === "add" ? ES.pct[k.key] + n : el.dataset.m === "prev" ? (ES.prev[k.key] || 0) : n; const inp = el.closest(".cpt").querySelector("input"); inp.value = N1.format(v); estCambio(i, String(v), true); }
  else if (a === "e-hoy") { if (!ES) return; ES.fecha = hoy(); ES.p.el.querySelector("#e-fecha").value = ES.fecha; guardarBorradorLocal(); }
